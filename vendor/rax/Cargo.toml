# Vendored copy of rax @ c468ca32087553bb6c16aad10c17c08fee24ce95 with
# minimal `pub` additions; see PATCHES.md in this directory.
[workspace]
# Vendored copy of rax: a standalone workspace root so that raxdbg's
# workspace does not try to own it (see vendor/rax/PATCHES.md).
[package]
name = "rax"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Multi-ISA emulator and virtual-machine monitor"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/HexRaysSA/rax"
readme = "README.md"
# Ship engine source, not reference documents, guest images or local research.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[[bin]]
name = "rax-isa-oracle"
path = "src/bin/rax_isa_oracle.rs"

[[bin]]
name = "rax-user"
path = "src/bin/rax_user.rs"

[features]
default = ["kvm", "smir-jit"]
kvm = ["kvm-bindings", "kvm-ioctls"]
hvf = []
trace = []
debug = []
profiling = []
x86_64-suite = []
x86-suite = ["x86_64-suite"]
# SMIR native hot-block JIT tier (x86-64 and AArch64 hosts). ON by default: it is
# fail-safe: each host backend admits only operations covered by its register,
# flag, memory, and feature gates, otherwise execution remains interpreted. The
# x86-64 host supports helper-backed memory/call regions and verification mode;
# the x86-on-AArch64 path is legacy-GPR scalar-only with an exact CF/ZF/SF/OF
# bridge and architecture-specific width/flag-contract validation. RISC-V uses
# a state-backed scalar/helper ABI on both x86-64 and AArch64 hosts. Brings in
# the Unix W^X exec-mmap runtime and vCPU integration. Disable x86 hot-region
# promotion at runtime with RAX_NO_JIT=1.
smir-jit = []

[lints.rust]
warnings = "allow"

[lints.clippy]
all = "allow"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
linux-loader = { version = "0.13.2", features = ["bzimage", "elf"] }
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
thiserror = "2.0.17"
toml = "0.9.10"
bitflags = "2.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
# `default-features = false` drops vm-memory's `rawfd` default feature, which
# pulls in libc-only file-descriptor I/O helpers and hard-errors on Windows
# (`compile_error!` in its lib.rs). RAX uses none of those helpers — only the
# `backend-mmap` backend, which is fully cross-platform (vm-memory ships a
# winapi Windows mmap implementation).
#
# NOTE: this alone does not get RAX onto Windows. `linux-loader` depends on
# vm-memory with default features ON (every published version does), so `rawfd`
# is still force-enabled transitively. Cargo cannot subtract a feature a
# transitive crate requests, so a Windows build additionally needs the
# `[patch.crates-io]` below that stops linux-loader from pulling vm-memory's
# defaults.
#
# The version is pinned EXACTLY (`=0.17.1`): linux-loader 0.13.2 caps vm-memory
# at `<=0.17.1`, and 0.17.1 is yanked, so a caret `^0.17.1` lets this crate
# drift to 0.17.2 (a facade for the renamed `vm-memory-new`) while linux-loader
# falls back to 0.16.2 — splitting the graph across three incompatible
# vm-memory versions that fail to build. Exact-pinning keeps a single 0.17.1.
vm-memory = { version = "=0.17.1", default-features = false, features = ["backend-mmap"] }
goblin = "0.8.2"

# Profiling JSON export (optional)
serde_json = "1.0"

# Ctrl+C handling for graceful shutdown
ctrlc = "3.4"

# libc is used unconditionally on unix for terminal raw mode (termios), signal
# handlers that restore the TTY on crash, and the smir-jit W^X exec runtime.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# KVM support (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = "0.14.0", optional = true }
kvm-ioctls = { version = "0.24.0", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
# The stable C ABI contains every entry point in catch_unwind and promises to
# convert an internal panic to RAX_ERR_INTERNAL. Keep unwind tables in release
# artifacts so that contract remains true for librax, even though it costs a
# small amount of code size compared with panic="abort".
panic = "unwind"
strip = true

[profile.release.build-override]
opt-level = 3

[dev-dependencies]
libc = "0.2"

# linux-loader (every published version) depends on vm-memory with default
# features ON, which force-enables the `rawfd` feature for the whole graph;
# `rawfd` `compile_error!`s on Windows and cannot be unselected transitively.
# This patch points linux-loader at a one-line fork that sets
# `default-features = false` on its vm-memory dependency (the library only uses
# vm-memory's backend-agnostic core traits), so nothing pulls `rawfd` and the
# tree builds on Windows. Pinned to a commit for reproducibility; drop this once
# the change is released upstream (rust-vmm/linux-loader).
[patch.crates-io]
linux-loader = { git = "https://github.com/19h/linux-loader", rev = "f745b555942c4e840a784bca61e6f3976d101960" }
