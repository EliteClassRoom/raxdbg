[package]
name = "raxdbg-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Android emulation on top of raxdbg-core: ELF loader, syscalls, dvm (JNI), hooks, APK"

[dependencies]
raxdbg-core.workspace = true
raxdbg-backend-rax.workspace = true
log.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
goblin.workspace = true
zip.workspace = true
yaxpeax-arm.workspace = true
yaxpeax-arch.workspace = true
hex.workspace = true

[dev-dependencies]
env_logger.workspace = true
object.workspace = true
# The decoder comparison in tests/arm32_decoding.rs needs rax's own Thumb
# instruction-size rule to check our disassembly against the CPU's.
rax = { git = "https://github.com/HexRaysSA/rax", rev = "c468ca32087553bb6c16aad10c17c08fee24ce95", default-features = false }

[lints]
workspace = true
